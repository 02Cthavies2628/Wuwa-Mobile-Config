;		WuWa Mobile Config for Version 3.6
; 		   Config Tier: High-End (Snapdragon/Adreno)
;====================================================================

[SnapdragonHighEnd DeviceProfile]
CVars=t.MaxFPS=120
CVars=r.Mobile.DeviceEvaluation=3
CVars=r.Mobile.HighQualityMaterial=1
CVars=r.Android.DisableVulkanSupport=0
CVars=r.Mobile.EnergySavingFrameInterpolation=0
CVars=r.imp.SSMbScaleLod0=0.750
CVars=r.imp.SSMbScaleLod1=1.750
; CVars=r.ScreenPercentage=100  ; REMOVED - r.ScreenPercentage is on Kuro's forbidden CVars list; ConfigMonitor strips it at runtime, this line did nothing.
CVars=r.GSR.Enabled=1
; ^ Unverified - no confirmed usage found anywhere in the reference
;   repo. Watch closely during testing.
CVars=r.Streaming.UsingNewKuroStreaming=1
CVars=r.Streaming.UsingKuroStreamingPriority=3
CVars=r.Streaming.MipBias=0
CVars=r.StaticMeshLODDistanceScale=0.5
CVars=r.Shadow.MaxResolution=2048
CVars=foliage.DensityScale=2.0
CVars=grass.CullDistanceScale=2.0
CVars=r.AmbientOcclusionLevels=3
CVars=r.AmbientOcclusionMaxQuality=100
CVars=fx.Niagara.QualityLevel=3
CVars=r.KuroVolumeCloudEnable=1
CVars=wp.Runtime.LoadingRangeScale=1.0
CVars=wp.Runtime.PlannedLoadingRangeScale=1.2
CVars=r.KuroFI.EnableSingleOcclusionBloomReplace=1
CVars=r.KuroFI.InternalResolutionScale=0.5
CVars=r.KuroFI.Enable=1
CVars=r.PSO.LRUCapacity=16384
; -- VRS: disabled by default. Not used in any current-gen repo tier -
;   only appeared in a "Deprecated Configs" experiment, and even
;   there the real cvar names were different. Uncomment to test at
;   your own risk with the actually-used names below.
;CVars=r.VRS.EnableImage=1
;CVars=r.VRS.ContrastAdaptiveShading=1
; -- Scalability Groups --
; sg.EffectsQuality hard-capped at 2 - anything higher crashes.
CVars=sg.ViewDistanceQuality=4
CVars=sg.AntiAliasingQuality=3
CVars=sg.ShadowQuality=3
CVars=sg.PostProcessQuality=6
CVars=sg.TextureQuality=6
CVars=sg.EffectsQuality=2
CVars=sg.FoliageQuality=3
CVars=sg.ShadingQuality=3

