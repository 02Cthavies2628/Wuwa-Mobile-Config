;		WuWa Mobile Config for Version 3.5
; 		   Config Tier: Stable Low-End (Snapdragon/Adreno)
;====================================================================

[SnapdragonLow DeviceProfile]
Cvars=r.Android.DisableVulkanSupport=0
Cvars=r.Mobile.DeviceEvaluation=3
Cvars=r.Mobile.HighQualityMaterial=0
CVars=r.ScreenPercentage=70
CVars=r.GSR.Enabled=1
; ^ Unverified - no confirmed usage found anywhere in the reference
;   repo. Watch closely during testing; remove if no visible effect
;   or if it causes artifacts.
CVars=r.Streaming.UsingNewKuroStreaming=1
CVars=r.Streaming.UsingKuroStreamingPriority=3
CVars=r.Streaming.MipBias=8
CVars=r.StaticMeshLODDistanceScale=1.2
CVars=r.ShadowQuality=0
CVars=r.Shadow.MaxResolution=256
CVars=foliage.DensityScale=0.3
CVars=fx.Niagara.QualityLevel=0
CVars=wp.Runtime.LoadingRangeScale=0.32
CVars=wp.Runtime.PlannedLoadingRangeScale=0.4
CVars=r.KuroFI.Enable=0
; -- Scalability Groups --
CVars=sg.ViewDistanceQuality=1
CVars=sg.AntiAliasingQuality=0
CVars=sg.ShadowQuality=0
CVars=sg.PostProcessQuality=0
CVars=sg.TextureQuality=0
CVars=sg.EffectsQuality=0
CVars=sg.FoliageQuality=0
CVars=sg.ShadingQuality=0
; -- Anti Thermal Throttling --
CVars=r.Mobile.EnergySavingFrameInterpolation=0
CVars=r.DontLimitOnBattery=1

