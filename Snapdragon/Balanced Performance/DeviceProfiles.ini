;		WuWa Mobile Config for Version 3.6
; 		   Config Tier: Balanced Performance (Snapdragon/Adreno)
;====================================================================
[SnapdragonBalancedPerformance DeviceProfile]
CVars=t.MaxFPS=120
CVars=r.Android.DisableVulkanSupport=0
; CVars=r.ScreenPercentage=85  ; REMOVED - r.ScreenPercentage is on Kuro's forbidden CVars list; ConfigMonitor strips it at runtime, this line did nothing.
CVars=r.GSR.Enabled=1
; ^ Unverified - no confirmed usage found anywhere in the reference
;   repo. Watch closely during testing.
CVars=r.Streaming.UsingNewKuroStreaming=1
CVars=r.Streaming.UsingKuroStreamingPriority=3
CVars=r.Streaming.MipBias=4
CVars=r.StaticMeshLODDistanceScale=0.9
CVars=r.ShadowQuality=1
CVars=r.Shadow.MaxResolution=512
CVars=foliage.DensityScale=0.8
CVars=grass.CullDistanceScale=0.8
CVars=fx.Niagara.QualityLevel=1
CVars=wp.Runtime.LoadingRangeScale=0.5
CVars=wp.Runtime.PlannedLoadingRangeScale=0.6
CVars=r.KuroFI.EnableSingleOcclusionBloomReplace=1
CVars=r.KuroFI.InternalResolutionScale=0.5
CVars=r.KuroFI.Enable=1
CVars=r.PSO.LRUCapacity=4096
; -- Scalability Groups --
CVars=sg.ViewDistanceQuality=2
CVars=sg.AntiAliasingQuality=1
CVars=sg.ShadowQuality=0
CVars=sg.PostProcessQuality=2
CVars=sg.TextureQuality=1
CVars=sg.EffectsQuality=1
CVars=sg.FoliageQuality=0
CVars=sg.ShadingQuality=2
; =====================================================
; DEVICE FAMILY MAPPING (Snapdragon/Adreno mid-tier)
; Sits between the Low-End tier's _Low variants and
