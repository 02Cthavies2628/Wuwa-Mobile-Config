;		WuWa Mobile Config for Version 3.5
; 		   Config Tier: Balanced Visual (Non-Snapdragon)
;====================================================================

[BalancedVisual DeviceProfile]
CVars=r.ScreenPercentage=100
CVars=r.Streaming.UsingNewKuroStreaming=1
CVars=r.Streaming.UsingKuroStreamingPriority=3
CVars=r.Streaming.MipBias=2
CVars=r.StaticMeshLODDistanceScale=0.8
CVars=r.ShadowQuality=2
CVars=r.Shadow.DistanceScale=1.0
CVars=r.Shadow.MaxResolution=512
CVars=foliage.DensityScale=1.0
CVars=grass.CullDistanceScale=1.0
CVars=fx.Niagara.QualityLevel=2
CVars=r.KuroVolumeCloudEnable=1
CVars=wp.Runtime.LoadingRangeScale=0.7
CVars=wp.Runtime.PlannedLoadingRangeScale=0.8
CVars=r.KuroFI.EnableSingleOcclusionBloomReplace=1
CVars=r.KuroFI.InternalResolutionScale=0.5
CVars=r.KuroFI.Enable=1
CVars=r.PSO.LRUCapacity=4096
; Main CVars
CVars=r.Mobile.DeviceEvaluation=3
CVars=r.Mobile.HighQualityMaterial=1
Cvars=r.Android.DisableVulkanSupport=0
; -- Scalability Groups --
; sg.EffectsQuality hard-capped at 2 - anything higher crashes.
CVars=sg.ViewDistanceQuality=3
CVars=sg.AntiAliasingQuality=2
CVars=sg.ShadowQuality=2
CVars=sg.PostProcessQuality=4
CVars=sg.TextureQuality=3
CVars=sg.EffectsQuality=2
CVars=sg.FoliageQuality=3
CVars=sg.ShadingQuality=3

