;		WuWa Mobile Config for Version 3.5
; 		   Config Tier: Balanced Performance (Non-Snapdragon)
;====================================================================

[BalancedPerformance DeviceProfile]
CVars=t.MaxFPS=120
Cvars=r.Android.DisableVulkanSupport=0
CVars=r.Streaming.UsingNewKuroStreaming=1
CVars=r.Streaming.UsingKuroStreamingPriority=3
CVars=r.Streaming.MipBias=6
CVars=r.StaticMeshLODDistanceScale=1.0
CVars=r.Shadow.DistanceScale=0.8
CVars=r.Shadow.MaxResolution=256
CVars=foliage.DensityScale=0.5
CVars=grass.CullDistanceScale=0.7
CVars=fx.Niagara.QualityLevel=1
CVars=wp.Runtime.LoadingRangeScale=0.5
CVars=wp.Runtime.PlannedLoadingRangeScale=0.65
CVars=r.KuroFI.EnableSingleOcclusionBloomReplace=1
CVars=r.KuroFI.InternalResolutionScale=0.5
CVars=r.KuroFI.Enable=1
CVars=r.PSO.LRUCapacity=2048
; -- Scalability Groups --
CVars=sg.ViewDistanceQuality=1
CVars=sg.AntiAliasingQuality=1
CVars=sg.ShadowQuality=0
CVars=sg.PostProcessQuality=2
CVars=sg.TextureQuality=1
CVars=sg.EffectsQuality=1
CVars=sg.FoliageQuality=0
CVars=sg.ShadingQuality=2

